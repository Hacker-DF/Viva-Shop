<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B2545">
  <title>Nouveau mot de passe · Viva Shop</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <main style="max-width:460px;margin:40px auto;padding:0 16px">
    <section class="card auth">
      <h1>Nouveau mot de passe</h1>
      <p id="status" class="hint">Vérification du lien…</p>

      <form id="reset-form" novalidate hidden>
        <div class="field">
          <label for="pw">Nouveau mot de passe</label>
          <input id="pw" name="password" type="password" minlength="8" required autocomplete="new-password">
          <small class="hint">8 caractères minimum</small>
        </div>
        <div class="field">
          <label for="pw2">Confirmer le mot de passe</label>
          <input id="pw2" name="confirm" type="password" minlength="8" required autocomplete="new-password">
        </div>
        <div id="reset-msg" class="alert alert-error" role="alert" hidden></div>
        <button class="btn btn-primary btn-block" type="submit">Enregistrer</button>
      </form>

      <p class="auth-footer"><a href="index.html#/connexion">Retour à la connexion</a></p>
    </section>
  </main>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';
    import { APP_CONFIG, isConfigured } from './js/config.js';

    const status = document.getElementById('status');
    const form = document.getElementById('reset-form');
    const msg = document.getElementById('reset-msg');

    if (!isConfigured()) {
      status.textContent = 'Service non configuré.';
    } else {
      const supabase = createClient(APP_CONFIG.supabaseUrl, APP_CONFIG.supabaseAnonKey, {
        auth: { detectSessionInUrl: true, persistSession: true, autoRefreshToken: true },
      });

      let ready = false;
      const showForm = () => {
        if (ready) return;
        ready = true;
        status.textContent = 'Choisissez votre nouveau mot de passe.';
        form.hidden = false;
      };

      // Le lien de l'email ouvre une session de récupération
      supabase.auth.onAuthStateChange((event, session) => {
        if (event === 'PASSWORD_RECOVERY' || session) showForm();
      });
      setTimeout(async () => {
        if (ready) return;
        const { data } = await supabase.auth.getSession();
        if (data.session) showForm();
        else status.textContent = 'Ce lien est invalide ou a expiré. Demandez-en un nouveau depuis la page de connexion.';
      }, 2000);

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const pw = document.getElementById('pw').value;
        const pw2 = document.getElementById('pw2').value;
        msg.hidden = true;
        if (pw.length < 8) { msg.textContent = 'Le mot de passe doit comporter au moins 8 caractères.'; msg.hidden = false; return; }
        if (pw !== pw2) { msg.textContent = 'Les deux mots de passe ne correspondent pas.'; msg.hidden = false; return; }

        const { error } = await supabase.auth.updateUser({ password: pw });
        if (error) { msg.textContent = 'Modification impossible : ' + error.message; msg.hidden = false; return; }

        // Reconnexion obligatoire avec le nouveau mot de passe
        await supabase.auth.signOut();
        form.hidden = true;
        status.textContent = 'Votre mot de passe a été modifié. Vous pouvez vous connecter.';
        status.insertAdjacentHTML('afterend', '<p><a class="btn btn-primary btn-block" href="index.html#/connexion">Se connecter</a></p>');
      });
    }
  </script>
</body>
</html>
