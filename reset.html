<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B2545">
  <title>Nouveau mot de passe · Viva Shop</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <main style="max-width:460px;margin:40px auto;padding:0 16px">
    <section class="card auth">
      <h1>Nouveau mot de passe</h1>
      <p id="status" class="hint">Vérification du lien…</p>

      <form id="reset-form" novalidate hidden>
        <div class="field">
          <label for="pw">Nouveau mot de passe</label>
          <input id="pw" name="password" type="password" minlength="8" required autocomplete="new-password">
          <small class="hint">8 caractères minimum</small>
        </div>
        <div class="field">
          <label for="pw2">Confirmer le mot de passe</label>
          <input id="pw2" name="confirm" type="password" minlength="8" required autocomplete="new-password">
        </div>
        <div id="reset-msg" class="alert alert-error" role="alert" hidden></div>
        <button class="btn btn-primary btn-block" type="submit">Enregistrer</button>
      </form>

      <p class="auth-footer"><a href="index.html#/connexion">Retour à la connexion</a></p>
    </section>
  </main>

  <script type="module" src="js/reset.js"></script>
</body>
</html>
