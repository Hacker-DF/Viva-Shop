<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Viva Shop – Votre passerelle entre la Chine et le Togo">
  <meta name="theme-color" content="#0B2545">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Viva Shop">
  <title>Viva Shop – Commander des produits de Chine au Togo</title>
  <meta name="description" content="Viva Shop, votre passerelle entre la Chine et le Togo : commandez des produits de Chine, suivez votre colis et payez par Mixx by Yas ou Flooz.">
  <meta name="keywords" content="Viva Shop, commande Chine Togo, produits de Chine, importation Togo, Mixx by Yas, Flooz, Lomé">
  <link rel="canonical" href="https://viva-shop.vercel.app/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Viva Shop">
  <meta property="og:title" content="Viva Shop – Votre passerelle entre la Chine et le Togo">
  <meta property="og:description" content="Commandez des produits de Chine depuis le Togo. Boutique, suivi des colis, paiement par Mixx by Yas ou Flooz.">
  <meta property="og:url" content="https://viva-shop.vercel.app/">
  <meta property="og:image" content="https://viva-shop.vercel.app/assets/icons/icon-192.png">
  <meta property="og:locale" content="fr_FR">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Viva Shop">
  <meta name="twitter:description" content="Votre passerelle entre la Chine et le Togo.">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://viva-shop.vercel.app/#website",
        "url": "https://viva-shop.vercel.app/",
        "name": "Viva Shop",
        "inLanguage": "fr",
        "description": "Votre passerelle entre la Chine et le Togo"
      },
      {
        "@type": "Organization",
        "@id": "https://viva-shop.vercel.app/#organization",
        "name": "Viva Shop",
        "url": "https://viva-shop.vercel.app/",
        "logo": "https://viva-shop.vercel.app/assets/icons/icon-192.png",
        "areaServed": "TG",
        "description": "Commande de produits de Chine pour les clients au Togo"
      }
    ]
  }
  </script>

  <script src="js/boot.js"></script>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/shop.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/modern.css">
</head>
<body>

  <!-- En-tête -->
  <header class="app-header">
    <a href="#/accueil" class="brand" aria-label="Viva Shop – Accueil">
      <img class="brand-logo" src="assets/logo-transparent.png" width="38" height="38" alt="Logo Viva Shop">
      <span class="brand-text">
        <strong>Viva Shop</strong>
        <small id="brand-slogan">Votre passerelle entre la Chine et le Togo</small>
      </span>
    </a>
    <div class="header-tools">
      <select id="lang-select" class="lang-select" aria-label="Langue"></select>
      <span class="bell-wrap">
        <a id="bell" class="icon-btn" href="#/notifications" aria-label="Notifications"></a>
        <span id="bell-count" class="bell-count" hidden></span>
      </span>
      <button id="theme-toggle" class="icon-btn" type="button"></button>
      <span id="connection-status" class="status" role="status" aria-live="polite">Vérification…</span>
    </div>
  </header>

  <!-- Bannière d'information / erreurs globales -->
  <div id="global-banner" class="global-banner" hidden></div>

  <!-- Contenu : rendu par le routeur -->
  <main id="app" class="app-main" tabindex="-1">
    <div class="loader" aria-label="Chargement"></div>
  </main>

  <!-- Navigation principale : 5 menus -->
  <nav id="bottom-nav" class="bottom-nav" aria-label="Navigation principale"></nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
